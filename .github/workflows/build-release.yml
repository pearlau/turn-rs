
name: Build and Release turn-server

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: turn-server-x86_64-unknown-linux-musl

          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: turn-server-aarch64-unknown-linux-musl

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            musl-tools \
            cmake \
            perl \
            nasm \
            binutils

      - name: Install Rust target
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build static binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build \
            --release \
            --locked \
            --package turn-server \
            --target ${{ matrix.target }}

      - name: Verify static binary
        run: |
          BIN="target/${{ matrix.target }}/release/turn-server"

          test -f "$BIN"

          file "$BIN"

          if readelf -l "$BIN" | grep -q INTERP; then
            echo "ERROR: Binary contains a dynamic interpreter!"
            exit 1
          fi

          if readelf -d "$BIN" 2>/dev/null | grep -q NEEDED; then
            echo "ERROR: Binary has dynamic dependencies!"
            exit 1
          fi

          echo "Static linking verification passed!"

      - name: Prepare release artifact
        run: |
          mkdir -p dist

          cp target/${{ matrix.target }}/release/turn-server \
            dist/${{ matrix.binary }}

          chmod +x dist/${{ matrix.binary }}

          cd dist
          sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: turn-server-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turn-server-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum turn-server-* > SHA256SUMS

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/turn-server-x86_64-unknown-linux-musl
            dist/turn-server-aarch64-unknown-linux-musl
            dist/turn-server-x86_64-unknown-linux-musl.sha256
            dist/turn-server-aarch64-unknown-linux-musl.sha256
            dist/SHA256SUMS
